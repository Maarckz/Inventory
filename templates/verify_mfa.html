
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação MFA · Inventory</title>

    <script>
    (function() {
        try {
            var t = localStorage.getItem('theme');
            if (t === null || t === undefined) {
                t = (window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark' : 'light';
            }
            document.documentElement.classList.toggle('dark-mode', t === 'dark');
        } catch (e) {  }
    })();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            --primary: #6366F1;
            --primary-dark: #4f46e5;
            --danger: #EF4444;
            --light: #F8FAFC;
            --dark: #1E293B;
            --gray: #94A3B8;

            --bg-page: #F1F5F9;
            --bg-card: #FFFFFF;
            --border-input: #E2E8F0;
            --text-main: #1E293B;
            color-scheme: light;
        }

        html.dark-mode {
            color-scheme: dark;
            --primary: #818cf8;
            --primary-dark: #4f46e5;
            --light: #1e293b;
            --dark: #f8fafc;
            --gray: #94A3B8;
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --border-input: #334155;
            --text-main: #f1f5f9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .mfa-container {
            width: 100%;
            max-width: 400px;
        }

        .mfa-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 0 2rem 2rem 2rem;
            text-align: center;
        }

        .mfa-logo {
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .mfa-logo i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .mfa-logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-input);
            background: var(--bg-card);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .alert {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .alert-error {
            background: #FEE2E2;
            color: #B91C1C;
        }
        .mfa-container, .mfa-card, .mfa-logo, form, .alert {
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }
        .mfa-container { animation-delay: 0.1s; }
        .mfa-card { animation-delay: 0s; }
        .mfa-logo { animation-delay: 0s; }
        form { animation-delay: 0.0s; }
        .alert { animation-delay: 0.1s; }
        @keyframes fadeIn {
            to {
            opacity: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    <style>
        body {
            background:
                radial-gradient(900px 500px at 12% -8%, rgba(99, 102, 241, .16), transparent 60%),
                radial-gradient(800px 460px at 108% 112%, rgba(79, 70, 229, .14), transparent 60%),
                var(--bg-page);
        }

        html.dark-mode body {
            background:
                radial-gradient(900px 500px at 12% -8%, rgba(99, 102, 241, .22), transparent 60%),
                radial-gradient(800px 460px at 108% 112%, rgba(79, 70, 229, .18), transparent 60%),
                #0b1120;
        }

        .mfa-card {
            background: color-mix(in srgb, var(--bg-card) 88%, transparent);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid rgba(148, 163, 184, .22);
            border-radius: 20px;
            box-shadow: 0 18px 44px -14px rgba(15, 23, 42, .25);
        }

        html.dark-mode .mfa-card {
            border-color: rgba(148, 163, 184, .14);
            box-shadow: 0 22px 54px -16px rgba(2, 6, 23, .8);
        }

        .btn {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            border-radius: 11px;
            box-shadow: 0 6px 18px -6px rgba(99, 102, 241, .55);
        }

        .btn:hover {
            background: linear-gradient(135deg, #575AEF 0%, #4338CA 100%);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="mfa-container" style="padding: 30px;">
        <div class="mfa-card" style="padding: inherit;">
            <div class="mfa-logo">
                <i class="fas fa-shield-alt"></i>
                <h1>Verificação MFA</h1>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('verify_mfa') }}">
                <div class="form-group">
                    <input type="text" name="code" placeholder="Código de 6 dígitos" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary">Verificar</button>
            </form>
        </div>
    </div>

            </form>
        </div>
    </div>
</body>
</html>
